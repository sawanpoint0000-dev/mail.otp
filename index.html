<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TAMP.OTP FINAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}

.logout{
 width:auto;
 padding:6px 14px;
 font-size:13px;
 border-radius:8px;
}

body{
 margin:0;
 min-height:100vh;
 font-family:system-ui;
 background:#0b0e14;
 color:#fff;
}
.card{
 background:#161a22;
 margin:12px;
 padding:14px;
 border-radius:14px;
}
input,select,button{
 width:100%;
 padding:10px;
 border-radius:8px;
 border:none;
 background:#020617;
 color:#fff;
}
button{
 cursor:pointer;
 background:linear-gradient(135deg,#7c7cff,#4f46e5);
 font-weight:600;
}
.logout{background:#ef4444}
.hide{display:none}

.row{
 background:#10131a;
 padding:10px;
 border-radius:12px;
 margin-bottom:8px;
 display:flex;
 gap:8px;
 align-items:center;
}
.row span{
 flex:1;
 font-size:13px;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}
.copy{
 background:#22c55e;
 color:#000;
 width:auto;
}
.otp{
 width:90px;
 min-width:80px;
 text-align:center;
 font-weight:700;
 background:#020617;
 border:1px solid #22c55e;
 border-radius:8px;
 color:#22c55e;
}
.time{
 font-size:12px;
 color:#f87171;
 min-width:52px;
 text-align:right;
 font-weight:700;
}
.adminUser{
 background:#0f172a;
 padding:10px;
 border-radius:12px;
 margin-bottom:8px;
 font-size:13px;
}
.adminUser button{
 width:auto;
 margin-right:6px;
 padding:6px 10px;
}
.avatar{
 width:44px;
 height:44px;
 border-radius:50%;
 background:linear-gradient(135deg,#7c7cff,#22c55e);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:20px;
 font-weight:800;
 color:#000;
}
</style>
</head>
<body>

<!-- 🔊 SOUNDS -->
<audio id="buySound" preload="auto">
 <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>
<audio id="otpSound" preload="auto">
 <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>

<!-- 🔐 AUTH -->
<div class="card" id="auth">
<h3>Login / Register</h3>
<input id="email" placeholder="Email">
<br><br>
<input id="pass" placeholder="Password">
<br><br>
<button onclick="login()">Login</button>
<br><br>
<button onclick="register()" style="background:#22c55e">Register</button>
</div>

<!-- 🚀 APP -->
<div id="app" class="hide">

<div class="card" style="display:flex;justify-content:space-between;align-items:center">
<b>TAMP.OTP</b>
<button class="logout" onclick="logout()">Logout</button>
</div>

<!-- 👑 ADMIN -->
<div id="adminBox" class="card hide">
<h3>ADMIN PANEL</h3>

<input id="newDomain" placeholder="@gmail.com">
<button onclick="addDomain()">Add Domain</button>
<br><br>

<select id="adminDomain"></select>
<br><br>

<input id="adminMail" placeholder="username">
<button onclick="addMail()">Add Mail</button>

<h4>Domain Stock</h4>
<div id="stocks"></div>

<h4>Users</h4>
<div id="users"></div>
</div>

<!-- 👤 USER -->
<div id="userBox" class="card hide">
<div style="display:flex;gap:10px;align-items:center">
 <div class="avatar" id="avatar"></div>
 <div>
  <b id="userEmail"></b><br>
  Balance ₹ <b id="bal">0</b>
 </div>
</div>

<br>
<select id="userDomain">
<option value="">-- Select Domain --</option>
</select>
<br><br>
<button onclick="buyMail()">Buy Mail ₹1</button>
</div>

<div id="list" class="card"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyDi40uxY5aC8R3xqacPL393h67TuQ4RiVo",
 databaseURL:"https://real-time-chat-box-179ea-default-rtdb.firebaseio.com"
});
const db=firebase.database();
const PRICE=1, EXPIRE=600000;
let uid="", isAdmin=false;

const beep=()=>document.getElementById("buySound").play().catch(()=>{});
const otpBeep=()=>document.getElementById("otpSound").play().catch(()=>{});

/* LOGIN */
function login(){
 if(email.value==="admin@tampotp.com" && pass.value==="admin@123"){
  localStorage.uid="admin";location.reload();return;
 }
 db.ref("users").once("value",s=>{
  let ok=false;
  s.forEach(u=>{
   if(u.val().email===email.value && u.val().pass===pass.value){
    localStorage.uid=u.key;ok=true;
   }
  });
  if(!ok) alert("Wrong login");
  else location.reload();
 });
}

/* REGISTER */
function register(){
 let id="u"+Date.now();
 db.ref("users/"+id).set({
  email:email.value,
  pass:pass.value,
  balance:0,
  blocked:false,
  canBuy:true
 });
 localStorage.uid=id;
 location.reload();
}

function logout(){localStorage.clear();location.reload()}

/* AUTO LOGIN */
uid=localStorage.uid||"";
if(uid){
 auth.classList.add("hide");
 app.classList.remove("hide");
 if(uid==="admin"){isAdmin=true;adminBox.classList.remove("hide")}
 else userBox.classList.remove("hide");
}

/* USER DATA */
db.ref("users/"+uid).on("value",s=>{
 if(!s.exists())return;
 bal.innerText=s.val().balance||0;
 if(!isAdmin){
  userEmail.innerText=s.val().email;
  avatar.innerText=s.val().email.charAt(0);
 }
 if(s.val().blocked){alert("Blocked");logout()}
});

/* DOMAINS */
db.ref("domains").on("value",s=>{
 adminDomain.innerHTML="";
 userDomain.innerHTML='<option value="">-- Select Domain --</option>';
 stocks.innerHTML="";
 s.forEach(d=>{
  adminDomain.innerHTML+=`<option value="${d.key}">${d.val().name}</option>`;
  userDomain.innerHTML+=`<option value="${d.key}">${d.val().name} (${d.val().stock||0})</option>`;
  stocks.innerHTML+=`${d.val().name} → ${d.val().stock||0}<br>`;
 });
});

/* ADD DOMAIN */
function addDomain(){
 if(!newDomain.value.startsWith("@")) return alert("Use @domain.com");
 let k=newDomain.value.replace(".","_");
 db.ref("domains/"+k).set({name:newDomain.value,stock:0,seq:0});
 newDomain.value="";
}

/* ADD MAIL */
function addMail(){
 let k=adminDomain.value,v=adminMail.value.trim();
 if(!k||!v)return;
 db.ref("domains/"+k).once("value",s=>{
  let email=v+s.val().name;
  let safe=email.replace(/[.#$/\[\]]/g,"_");
  db.ref("domains/"+k+"/seq").transaction(n=>{
   n=(n||0)+1;
   db.ref("mails/"+k+"/"+safe).set({email,no:n});
   return n;
  });
  db.ref("domains/"+k+"/stock").transaction(n=>(n||0)+1);
 });
 adminMail.value="";
}

/* BUY MAIL */
function buyMail(){
 let k=userDomain.value;
 if(!k) return alert("Select domain");
 db.ref("users/"+uid).once("value",u=>{
  if(!u.val().canBuy) return alert("Buy disabled");
  if((u.val().balance||0)<PRICE) return alert("No balance");
  db.ref("mails/"+k).orderByChild("no").limitToFirst(1).once("value",x=>{
   if(!x.exists()) return alert("Out of stock");
   let key,data;
   x.forEach(m=>{key=m.key;data=m.val()});
   db.ref("mails/"+k+"/"+key).remove();
   db.ref("domains/"+k+"/stock").transaction(n=>(n||0)-1);
   db.ref("msg").push({email:data.email,user:uid,time:Date.now(),otp:""});
   db.ref("users/"+uid+"/balance").transaction(b=>b-1);
   beep();
  });
 });
}

/* SHOW MAIL */
db.ref("msg").on("child_added",s=>{
 let d=s.val();
 if(d.user!==uid && !isAdmin) return;
 if(isAdmin) beep();

 let r=document.createElement("div");
 r.className="row";
 r.innerHTML=`
  <button class="copy">Copy</button>
  <span>${d.email}</span>
  <input class="otp" ${isAdmin?"":"disabled"}>
  <span class="time">10:00</span>
 `;
 r.querySelector(".copy").onclick=()=>navigator.clipboard.writeText(d.email);

 if(isAdmin){
  r.querySelector(".otp").oninput=e=>{
   db.ref("msg/"+s.key+"/otp").set(e.target.value);
   otpBeep();
  };
 }
 db.ref("msg/"+s.key+"/otp").on("value",x=>{
  r.querySelector(".otp").value=x.val()||"";
 });

 list.prepend(r);
 startTimer(d.time,r.querySelector(".time"),s.key);
});

/* ⏱ TIMER */
function startTimer(t,el,id){
 let x=setInterval(()=>{
  let l=EXPIRE-(Date.now()-t);
  if(l<=0){
   clearInterval(x);
   db.ref("msg/"+id).remove();
  }
  el.innerText=
   String(Math.floor(l/60000)).padStart(2,"0")+":"+
   String(Math.floor(l/1000)%60).padStart(2,"0");
 },1000);
}
</script>
</body>
</html>
