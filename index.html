<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TAMP.OTP FINAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#0b0e14;color:#fff;font-family:system-ui}
.card{background:#161a22;margin:12px;padding:14px;border-radius:14px}
.hide{display:none}
input,select,button{padding:10px;border-radius:8px;border:none}
button{cursor:pointer}
.row{background:#10131a;padding:10px;border-radius:12px;margin-bottom:8px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.copy{background:#22c55e;color:#000}
.otp{
 width:80px;text-align:center;color:red;background:#10131a;
 border:1px solid #22c55e;border-radius:4px;font-weight:700;
}
.time{font-size:12px;color:#f87171}
.row:hover{background:#151a24}
button:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>

<div class="card" id="auth">
<h3>Login / Register</h3>
<input id="email" placeholder="Email"><br><br>
<input id="pass" placeholder="Password"><br><br>
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>

<div id="app" class="hide">
<div class="card">
<b>TAMP.OTP</b>
<button onclick="logout()" style="float:right;background:#ef4444;color:#fff">Logout</button>
</div>

<div id="adminBox" class="card hide">
<h3>ADMIN PANEL</h3>
<input id="newDomain" placeholder="@gmail.com">
<button onclick="addDomain()">Add Domain</button><br><br>
<select id="adminDomain"></select><br><br>
<input id="adminMail" placeholder="Username or full email">
<button onclick="addMail()">Add Mail</button>
<h4>Stock</h4>
<div id="stocks"></div>
<h4>Users</h4>
<div id="users"></div>
</div>

<div id="userBox" class="card hide">
<h3>User Panel</h3>
Balance ₹<b id="bal">0</b><br><br>
<select id="userDomain"></select>
<button onclick="buyMail()">Buy Mail ₹1</button>
</div>

<div id="list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyDi40uxY5aC8R3xqacPL393h67TuQ4RiVo",
 databaseURL:"https://real-time-chat-box-179ea-default-rtdb.firebaseio.com"
});
const db=firebase.database();
let uid="",isAdmin=false;
const PRICE=1,EXPIRE=600000;

/* LOGIN */
function login(){
 if(email.value==="admin@tampotp.com" && pass.value==="admin@123"){
  localStorage.uid="admin";location.reload();return;
 }
 db.ref("users").once("value",s=>{
  s.forEach(u=>{
   if(u.val().email===email.value && u.val().pass===pass.value){
    localStorage.uid=u.key;location.reload();
   }
  });
 });
}

/* REGISTER */
function register(){
 let id="u"+Date.now();
 db.ref("users/"+id).set({
  email:email.value,pass:pass.value,balance:0,blocked:false
 });
 localStorage.uid=id;location.reload();
}

function logout(){localStorage.clear();location.reload()}

uid=localStorage.uid||"";
if(uid){
 auth.classList.add("hide");
 app.classList.remove("hide");
 if(uid==="admin"){isAdmin=true;adminBox.classList.remove("hide")}
 else userBox.classList.remove("hide");
}

/* DOMAINS */
db.ref("domains").on("value",s=>{
 adminDomain.innerHTML="";
 userDomain.innerHTML="";
 stocks.innerHTML="";
 s.forEach(d=>{
  adminDomain.innerHTML+=`<option value="${d.key}">${d.val().name}</option>`;
  userDomain.innerHTML+=`<option value="${d.key}">${d.val().name} (${d.val().stock||0})</option>`;
  stocks.innerHTML+=`${d.val().name} → ${d.val().stock||0}<br>`;
 });
});

function addDomain(){
 let d=newDomain.value;
 let k=d.replace(".","_");
 db.ref("domains/"+k).set({name:d,stock:0});
}

/* 🔥 ADD MAIL — FIFO FIX */
function addMail(){
 let k=adminDomain.value;
 let v=adminMail.value.trim();
 db.ref("domains/"+k).once("value",s=>{
  let dom=s.val().name;
  let email=v.includes("@")?v:v+dom;
  db.ref("mails/"+k).push({
   email:email,
   time:Date.now()
  });
  db.ref("domains/"+k+"/stock").transaction(n=>(n||0)+1);
  adminMail.value="";
 });
}

/* USER DATA */
db.ref("users/"+uid).on("value",s=>{
 if(s.exists()){
  bal.innerText=s.val().balance||0;
  if(s.val().blocked){alert("Blocked");logout();}
 }
});

/* BUY MAIL — FIFO ONLY */
function buyMail(){
 let k=userDomain.value;
 db.ref("users/"+uid+"/balance").once("value",b=>{
  if((b.val()||0)<PRICE) return alert("No balance");
  db.ref("mails/"+k)
   .orderByChild("time").limitToFirst(1)
   .once("value",x=>{
    if(!x.exists()) return alert("No mail");
    x.forEach(m=>{
     db.ref("mails/"+k+"/"+m.key).remove();
     db.ref("domains/"+k+"/stock").transaction(n=>(n||0)-1);
     db.ref("msg").push({
      email:m.val().email,
      user:uid,
      time:Date.now(),
      otp:""
     });
     db.ref("users/"+uid+"/balance").transaction(n=>n-PRICE);
    });
   });
 });
}

/* SHOW */
db.ref("msg").on("child_added",s=>{
 let d=s.val();
 if(d.user!==uid && !isAdmin) return;
 let r=document.createElement("div");
 r.className="row";
 r.innerHTML=`
 <button class="copy">Copy</button>
 <span>${d.email.replace(/^(.{3}).*(.{2}@)/,"$1*****$2")}</span>
 <input class="otp" ${isAdmin?"":"disabled"}>
 <span class="time">10:00</span>`;
 r.querySelector(".copy").onclick=()=>navigator.clipboard.writeText(d.email);
 if(isAdmin){
  r.querySelector(".otp").oninput=e=>db.ref("msg/"+s.key+"/otp").set(e.target.value);
 }
 db.ref("msg/"+s.key+"/otp").on("value",o=>{
  r.querySelector(".otp").value=o.val()||"";
 });
 list.prepend(r);
 startTimer(d.time,r.querySelector(".time"),s.key);
});

function startTimer(t,e,id){
 let x=setInterval(()=>{
  let l=EXPIRE-(Date.now()-t);
  if(l<=0){clearInterval(x);db.ref("msg/"+id).remove();}
  e.innerText=
   String(Math.floor(l/60000)).padStart(2,"0")+":"+
   String(Math.floor(l/1000)%60).padStart(2,"0");
 },1000);
}
</script>
</body>
</html>
