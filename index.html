<!DOCTYPE html>
<html>
<head>
  <title>MAIL.OTP</title>
  <style>
    .copy-btn {
      padding: 2px 6px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 12px;
    }

    .copied {
      background-color: #28a745 !important;
    }

    /* Right side container */
    .right-box {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 🔴 Red flowing indicator */
    .indicator {
      width: 10px;
      height: 10px;
      background-color: red;
      border-radius: 50%;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .time {
      font-size: 12px;
      color: red;
      font-weight: bold;
    }

    #chat p {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 4px 0;
    }
  </style>
</head>
<body>

<h3>Live Chat Box</h3>

<input id="email" placeholder="Enter Email"><br><br>
<input id="otp" placeholder="Enter OTP"><br><br>

<button onclick="sendMessage()">Send</button>

<hr>
<div id="chat"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyDi40uxY5aC8R3xqacPL393h67TuQ4RiVo",
    authDomain: "real-time-chat-box-179ea.firebaseapp.com",
    databaseURL: "https://real-time-chat-box-179ea-default-rtdb.firebaseio.com",
    projectId: "real-time-chat-box-179ea"
  };

  firebase.initializeApp(firebaseConfig);
  var database = firebase.database();

  const EXPIRE_TIME = 10 * 60 * 1000; // 10 minutes

  function sendMessage() {
    var email = document.getElementById("email").value.trim();
    var otp = document.getElementById("otp").value.trim();

    if (email && otp) {
      database.ref("messages").push({
        email: email,
        otp: otp,
        timestamp: Date.now()
      });
      document.getElementById("otp").value = "";
    }
  }

  function copyEmail(email, btn) {
    navigator.clipboard.writeText(email).then(() => {
      btn.classList.add("copied");
      setTimeout(() => btn.classList.remove("copied"), 1000);
    });
  }

  function formatTime(ms) {
    let s = Math.floor(ms / 1000);
    let m = String(Math.floor(s / 60)).padStart(2, "0");
    let sec = String(s % 60).padStart(2, "0");
    return m + ":" + sec;
  }

  function renderChat() {
    let now = Date.now();
    database.ref("messages").once("value", function(snapshot) {
      let chat = document.getElementById("chat");
      chat.innerHTML = "";

      snapshot.forEach(function(child) {
        let key = child.key;
        let data = child.val();
        let remaining = EXPIRE_TIME - (now - data.timestamp);

        if (remaining <= 0) {
          database.ref("messages/" + key).remove();
          return;
        }

        let p = document.createElement("p");

        let btn = document.createElement("button");
        btn.textContent = "Copy";
        btn.className = "copy-btn";
        btn.onclick = () => copyEmail(data.email, btn);

        let emailText = document.createElement("b");
        emailText.textContent = data.email + ":";

        let otpText = document.createTextNode(" " + data.otp);

        // Right side (red flow + time)
        let rightBox = document.createElement("div");
        rightBox.className = "right-box";

        let indicator = document.createElement("span");
        indicator.className = "indicator";

        let timeText = document.createElement("span");
        timeText.className = "time";
        timeText.textContent = formatTime(remaining);

        rightBox.appendChild(indicator);
        rightBox.appendChild(timeText);

        p.appendChild(btn);
        p.appendChild(emailText);
        p.appendChild(otpText);
        p.appendChild(rightBox);

        chat.appendChild(p);
      });
    });
  }

  setInterval(renderChat, 1000);
</script>

</body>
</html>
