<!DOCTYPE html>
<html>
<head>
<title>TAMP.OTP</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0f1115;
  --card:#161a22;
  --text:#e8eaf0;
  --muted:#9aa3b2;
  --accent:#4f8cff;
  --success:#22c55e;
  --danger:#ef4444;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui;
  background:linear-gradient(135deg,#0b0e14,#111827);
  color:var(--text);
}
#navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  background:rgba(15,17,21,.9);
  backdrop-filter:blur(12px);
}
.container{max-width:520px;margin:auto;padding:14px}
.card{
  background:var(--card);
  border-radius:18px;
  padding:14px;
  margin-bottom:14px;
}
input{
  width:100%;
  padding:12px;
  border-radius:12px;
  background:#0b0e14;
  border:1px solid #222;
  color:#fff;
}
button{
  border:none;
  border-radius:14px;
  padding:12px;
  font-weight:600;
  cursor:pointer;
}
.row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  border-radius:16px;
  background:#10131a;
  margin-bottom:10px;
}
.row.highlight{
  box-shadow:0 0 15px rgba(250,204,21,.6);
}
.copy-btn{
  background:var(--success);
  color:#000;
  padding:6px 10px;
  font-size:12px;
}
.otp-input{
  width:90px;
  text-align:center;
  letter-spacing:2px;
}
.right{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:6px;
}
.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#555;
}
.dot.active{background:var(--success)}
.time{font-size:12px;color:#f87171}
.hide{display:none}
.menu{
  position:absolute;
  right:10px;
  top:52px;
  width:260px;
  background:#161a22;
  border-radius:16px;
  padding:14px;
}
.menu div{display:flex;justify-content:space-between;margin-bottom:6px}
.menu hr{border:none;height:1px;background:#333;margin:8px 0}
</style>
</head>

<body>

<div id="navbar">
  <b>TAMP.OTP</b>
  <div style="position:relative">
    <button onclick="toggleMenu()" style="background:none;color:#fff;font-size:20px">⋮</button>
    <div id="menu" class="menu hide">
      <div id="adminOnly" class="hide">
        👥 Active Users <b id="activeUsers">0</b>
        <hr>
      </div>
      <div>📦 Purchased <b id="buyCount">0</b></div>
      <div>✅ Success <b id="successCount">0</b></div>
      <div>🕒 Last Active <span id="lastActive">--</span></div>
      <div>⏱ Online <span id="onlineTime">0s</span></div>
      <hr>
      <button onclick="logout()" style="background:var(--danger);color:#fff;width:100%">Logout</button>
    </div>
  </div>
</div>

<div class="container">

<div class="card" id="adminLogin">
  <input id="adminPass" placeholder="Admin Password">
  <button onclick="adminLogin()" style="background:var(--accent);color:#fff">Admin Login</button>
</div>

<div class="card hide" id="adminPanel">
  <input id="email">
  <button onclick="addMail()" style="background:#f59e0b">Add Mail</button>
</div>

<div class="card">
  <button onclick="buyMail()" style="background:var(--accent);color:#fff">BUY MAIL</button>
</div>

<div id="chat"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyDi40uxY5aC8R3xqacPL393h67TuQ4RiVo",
  databaseURL:"https://real-time-chat-box-179ea-default-rtdb.firebaseio.com"
});
const db=firebase.database();
const EXPIRE=10*60*1000;

/* USER */
const uid=localStorage.getItem("uid")||("u"+Date.now());
localStorage.setItem("uid",uid);

/* MASK EMAIL */
function maskEmail(e){return e.substring(0,8)+"***********";}

/* MENU */
function toggleMenu(){menu.classList.toggle("hide")}
function logout(){localStorage.clear();location.reload()}

/* ONLINE */
let onlineStart=Date.now();
setInterval(()=>onlineTime.innerText=Math.floor((Date.now()-onlineStart)/1000)+"s",1000);

/* PRESENCE */
db.ref(".info/connected").on("value",s=>{
  if(s.val()){
    const r=db.ref("active/"+uid);
    r.set(Date.now());
    r.onDisconnect().remove();
  }
});
db.ref("active").on("value",s=>activeUsers.innerText=s.numChildren());

/* ADMIN */
function adminLogin(){
  if(adminPass.value!=="admin@123") return alert("Wrong");
  localStorage.setItem("isAdmin","1");
  adminLogin.classList.add("hide");
  adminPanel.classList.remove("hide");
  adminOnly.classList.remove("hide");
}

/* ADD MAIL */
function addMail(){
  if(!email.value) return;
  db.ref("lot").push(email.value);
  email.value="";
}

/* BUY MAIL */
function buyMail(){
  db.ref("lot").limitToFirst(1).once("value",s=>{
    if(!s.exists()) return alert("No mail");
    let mail,key;
    s.forEach(x=>{mail=x.val();key=x.key});
    db.ref("lot/"+key).remove();
    db.ref("msg").push({
      email:mail,
      otp:"",
      time:Date.now(),
      user:uid,
      success:false
    });
    db.ref("stat/"+uid+"/buy").transaction(n=>(n||0)+1);
  });
}

/* TIMER */
function startTimer(id,start,el){
  const t=setInterval(()=>{
    const l=EXPIRE-(Date.now()-start);
    if(l<=0){
      clearInterval(t);
      db.ref("msg/"+id).remove();
      document.getElementById(id)?.remove();
      return;
    }
    el.innerText=
      String(Math.floor(l/60000)).padStart(2,"0")+":"+
      String(Math.floor(l/1000)%60).padStart(2,"0");
  },1000);
}

/* SHOW */
db.ref("msg").on("child_added",s=>{
  const d=s.val(),id=s.key;
  const row=document.createElement("div");
  row.className="row";row.id=id;

  const copy=document.createElement("button");
  copy.className="copy-btn";copy.innerText="Copy";copy.disabled=true;

  const e=document.createElement("b");
  e.innerText=maskEmail(d.email);

  const otp=document.createElement("input");
  otp.className="otp-input";otp.type="password";otp.value=d.otp||"";
  if(localStorage.getItem("isAdmin")==="1"){
    otp.oninput=x=>db.ref("msg/"+id+"/otp").set(x.target.value);
  }else otp.disabled=true;

  const right=document.createElement("div");
  right.className="right";
  const dot=document.createElement("span");dot.className="dot";
  const time=document.createElement("span");
  time.className="time";time.innerText="10:00";
  right.append(dot,time);

  row.append(copy,e,otp,right);
  chat.prepend(row);

  startTimer(id,d.time,time);

  copy.onclick=()=>otp.value&&navigator.clipboard.writeText(otp.value);
});

/* OTP UPDATE */
db.ref("msg").on("child_changed",s=>{
  const d=s.val(),row=document.getElementById(s.key);
  if(!row||!d.otp) return;
  row.querySelector(".otp-input").value=d.otp;
  row.querySelector(".copy-btn").disabled=false;
  row.querySelector(".dot").classList.add("active");
  row.classList.add("highlight");

  if(!d.success){
    db.ref("msg/"+s.key+"/success").set(true);
    db.ref("stat/"+d.user+"/success").transaction(n=>(n||0)+1);
  }
});

/* STATS */
db.ref("stat/"+uid).on("value",s=>{
  const d=s.val()||{};
  buyCount.innerText=d.buy||0;
  successCount.innerText=d.success||0;
});
</script>
</body>
</html>
