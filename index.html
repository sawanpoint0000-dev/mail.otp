<!DOCTYPE html>
<html>
<head>
  <title>TAMP.OTP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial;margin:0}
#navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#222;
  color:#fff;
  padding:8px;
  font-size:14px
}
#users{
  color:#0f0;
  font-size:12px;
  max-width:50%;
  overflow:auto;
  white-space:nowrap
}
.container{padding:10px}
input{width:100%;padding:7px;margin:6px 0}
button{padding:6px 10px;cursor:pointer}
.row{
  display:flex;
  align-items:center;
  gap:6px;
  margin:6px 0
}
.copy-btn{
  background:#007bff;
  color:#fff;
  border:none;
  border-radius:4px
}
.copied{background:#28a745!important}
.otp-input{margin-left:auto;width:100px}
.right{
  display:flex;
  align-items:center;
  gap:4px
}
.dot{
  width:8px;
  height:8px;
  background:red;
  border-radius:50%;
  animation:pulse 1s infinite
}
@keyframes pulse{50%{opacity:.3}}
.time{color:red;font-size:11px}
</style>
</head>

<body>

<div id="navbar">
  <b>TAMP.OTP</b>
  <div id="users">Loading...</div>
  <div>Total: <b id="mailCount">0</b></div>
</div>

<div class="container">
  <input id="email" placeholder="Enter Email">
  <button onclick="sendMail()">Send</button>
  <hr>
  <div id="chat"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
/* 🔥 FIREBASE CONFIG */
firebase.initializeApp({
  apiKey:"AIzaSyDi40uxY5aC8R3xqacPL393h67TuQ4RiVo",
  authDomain:"real-time-chat-box-179ea.firebaseapp.com",
  databaseURL:"https://real-time-chat-box-179ea-default-rtdb.firebaseio.com",
  projectId:"real-time-chat-box-179ea"
});
var db=firebase.database();
const EXPIRE=10*60*1000;

/* 👤 USER NAME */
let user=localStorage.getItem("user_name");
if(!user){
  user=prompt("Enter Name")||("Guest"+Math.floor(Math.random()*999));
  localStorage.setItem("user_name",user);
}
db.ref("activeUsers/"+user).set(true);

/* 📩 SEND MAIL */
function sendMail(){
  let email=document.getElementById("email").value.trim();
  if(!email)return;
  db.ref("messages").push({
    email:email,
    otp:"",
    time:Date.now()
  });
  document.getElementById("email").value="";
}

/* 📋 COPY */
function copyMail(text,btn){
  navigator.clipboard.writeText(text);
  btn.classList.add("copied");
  setTimeout(()=>btn.classList.remove("copied"),800);
  db.ref("copyHistory/"+user+"/count")
    .transaction(c=>(c||0)+1);
}

/* 🔄 REALTIME RENDER – NEW MAIL ALWAYS ON TOP */
const chat=document.getElementById("chat");

db.ref("messages")
  .orderByChild("time")
  .on("child_added", snap=>{
    const d=snap.val();
    const id=snap.key;

    const row=document.createElement("div");
    row.className="row";
    row.id=id;

    const copy=document.createElement("button");
    copy.className="copy-btn";
    copy.innerText="Copy";
    copy.onclick=()=>copyMail(d.email,copy);

    const email=document.createElement("b");
    email.innerText=d.email;

    const otp=document.createElement("input");
    otp.className="otp-input";
    otp.placeholder="OTP";
    otp.value=d.otp||"";
    otp.oninput=e=>{
      db.ref("messages/"+id+"/otp").set(e.target.value);
    };

    const right=document.createElement("div");
    right.className="right";

    const dot=document.createElement("span");
    dot.className="dot";

    const time=document.createElement("span");
    time.className="time";

    right.append(dot,time);
    row.append(copy,email,otp,right);

    chat.prepend(row);   // 🔥 NEW MAIL ON TOP
    startTimer(id,d.time,time);
    updateMailCount();
});

/* ⏱️ TIMER */
function startTimer(id,start,el){
  const i=setInterval(()=>{
    const left=EXPIRE-(Date.now()-start);
    if(left<=0){
      db.ref("messages/"+id).remove();
      document.getElementById(id)?.remove();
      clearInterval(i);
      updateMailCount();
      return;
    }
    const m=Math.floor(left/60000);
    const s=Math.floor(left/1000)%60;
    el.innerText=`${m}:${s.toString().padStart(2,"0")}`;
  },1000);
}

/* 👥 USERS + COPY COUNT */
db.ref("activeUsers").on("value",snap=>{
  let arr=[];
  snap.forEach(u=>{
    db.ref("copyHistory/"+u.key+"/count").once("value",c=>{
      arr.push(u.key+"("+(c.val()||0)+")");
      users.innerText=arr.join(", ");
    });
  });
});

/* 🔢 MAIL COUNT */
function updateMailCount(){
  db.ref("messages").once("value",s=>{
    document.getElementById("mailCount").innerText=s.numChildren();
  });
}
</script>

</body>
</html>
