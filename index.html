<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TAMP.OTP FINAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;background:#0b0e14;color:#fff;font-family:system-ui}
.card{background:#161a22;margin:12px;padding:14px;border-radius:14px}
.hide{display:none}
input,select,button{padding:10px;border-radius:8px;border:none}
button{cursor:pointer}
.row{background:#10131a;padding:10px;border-radius:12px;margin-bottom:8px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.copy{background:#22c55e;color:#000}
.otp{
 width:80px;
 text-align:center;
 color:red;
 background:#10131a;
 border:1px solid #22c55e;
 border-radius:4px;
 font-weight:700;
}
.time{font-size:12px;color:#f87171}
button:disabled{opacity:.5}
.adminUser{
 background:#0f172a;
 padding:10px;
 border-radius:10px;
 margin-bottom:8px;
 font-size:12px
}
</style>
</head>
<body>

<!-- SOUND -->
<audio id="buySound" preload="auto">
 <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>

<!-- AUTH -->
<div class="card" id="auth">
<h3>Login / Register</h3>
<input id="email" placeholder="Email"><br><br>
<input id="pass" placeholder="Password"><br><br>
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>

<!-- APP -->
<div id="app" class="hide">

<div class="card">
<b>TAMP.OTP</b>
<button onclick="logout()" style="float:right;background:#ef4444;color:#fff">Logout</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminBox" class="card hide">
<h3>ADMIN PANEL</h3>

<h4>Domains</h4>
<input id="newDomain" placeholder="@gmail.com">
<button onclick="addDomain()">Add Domain</button><br><br>

<select id="adminDomain"></select><br><br>
<input id="adminMail" placeholder="username">
<button onclick="addMail()">Add Mail</button>

<h4>Domain Stock</h4>
<div id="stocks"></div>

<h4>Users</h4>
<div id="users"></div>
</div>

<!-- USER PANEL -->
<div id="userBox" class="card hide">
<h3>User Panel</h3>
<div>Balance ₹ <b id="bal">0</b></div><br>

<select id="userDomain">
<option value="">-- Select Domain --</option>
</select>
<button onclick="buyMail()">Buy Mail ₹1</button>
</div>

<div id="list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyDi40uxY5aC8R3xqacPL393h67TuQ4RiVo",
 databaseURL:"https://real-time-chat-box-179ea-default-rtdb.firebaseio.com"
});
const db=firebase.database();

const PRICE=1, EXPIRE=600000;
let uid="", isAdmin=false;

/* SOUND */
function playSound(){
 let a=document.getElementById("buySound");
 if(a){a.currentTime=0;a.play().catch(()=>{});}
}

/* LOGIN */
function login(){
 if(email.value==="admin@tampotp.com" && pass.value==="admin@123"){
  localStorage.uid="admin";location.reload();return;
 }
 db.ref("users").once("value",s=>{
  let ok=false;
  s.forEach(u=>{
   if(u.val().email===email.value && u.val().pass===pass.value){
    uid=u.key;ok=true;
   }
  });
  if(!ok) return alert("Wrong login");
  localStorage.uid=uid;location.reload();
 });
}

/* REGISTER */
function register(){
 if(!email.value||!pass.value) return alert("Fill all");
 let id="u"+Date.now();
 db.ref("users/"+id).set({
  email:email.value,pass:pass.value,balance:0,blocked:false
 });
 localStorage.uid=id;location.reload();
}

function logout(){localStorage.clear();location.reload()}

/* AUTO LOGIN */
uid=localStorage.uid||"";
if(uid){
 auth.classList.add("hide");
 app.classList.remove("hide");
 if(uid==="admin"){isAdmin=true;adminBox.classList.remove("hide")}
 else{userBox.classList.remove("hide")}
}

/* DOMAINS */
db.ref("domains").on("value",s=>{
 adminDomain.innerHTML="";
 userDomain.innerHTML='<option value="">-- Select Domain --</option>';
 stocks.innerHTML="";
 s.forEach(d=>{
  adminDomain.innerHTML+=`<option value="${d.key}">${d.val().name}</option>`;
  userDomain.innerHTML+=`<option value="${d.key}">${d.val().name} (${d.val().stock||0})</option>`;
  stocks.innerHTML+=`${d.val().name} → ${d.val().stock||0}<br>`;
 });
});

/* ADD DOMAIN */
function addDomain(){
 if(!newDomain.value.startsWith("@")) return alert("Use @domain.com");
 let k=newDomain.value.replace(".","_");
 db.ref("domains/"+k).set({name:newDomain.value,stock:0,seq:0});
 newDomain.value="";
}

/* ADD MAIL */
function addMail(){
 let k=adminDomain.value,v=adminMail.value.trim();
 if(!k||!v) return;
 db.ref("domains/"+k).once("value",s=>{
  let email=v+s.val().name;
  let safe=email.replace(/[.#$/\[\]]/g,"_");
  db.ref("domains/"+k+"/seq").transaction(n=>{
   n=(n||0)+1;
   db.ref("mails/"+k+"/"+safe).set({email,no:n});
   return n;
  });
  db.ref("domains/"+k+"/stock").transaction(n=>(n||0)+1);
  adminMail.value="";
 });
}

/* USER BALANCE */
db.ref("users/"+uid).on("value",s=>{
 if(!s.exists()) return;
 bal.innerText=s.val().balance||0;
 if(s.val().blocked){alert("Blocked");logout();}
});

/* ADMIN USERS */
if(isAdmin){
 db.ref("users").on("value",s=>{
  users.innerHTML="";
  s.forEach(u=>{
   if(u.key==="admin") return;
   let d=u.val();
   users.innerHTML+=`
   <div class="adminUser">
    <b>${d.email}</b><br>
    Balance ₹${d.balance||0}<br><br>
    <button onclick="addUserBalance('${u.key}')" style="background:#22c55e">Add INR</button>
    <button onclick="blockUser('${u.key}',${!d.blocked})"
     style="background:${d.blocked?'#22c55e':'#ef4444'}">
     ${d.blocked?'Unblock':'Block'}
    </button>
   </div>`;
  });
 });
}

function addUserBalance(id){
 let a=+prompt("Add INR");
 if(a>0) db.ref("users/"+id+"/balance").transaction(b=>(b||0)+a);
}
function blockUser(id,v){
 db.ref("users/"+id+"/blocked").set(v);
}

/* BUY MAIL */
function buyMail(){
 let k=userDomain.value;
 if(!k) return alert("Select domain");
 db.ref("users/"+uid+"/balance").once("value",s=>{
  if((s.val()||0)<PRICE) return alert("No balance");
  db.ref("mails/"+k).orderByChild("no").limitToFirst(1).once("value",x=>{
   if(!x.exists()) return alert("No mail");
   let key,data;
   x.forEach(m=>{key=m.key;data=m.val();});
   db.ref("mails/"+k+"/"+key).remove();
   db.ref("domains/"+k+"/stock").transaction(n=>(n||0)-1);
   db.ref("msg").push({email:data.email,user:uid,time:Date.now(),otp:""});
   db.ref("users/"+uid+"/balance").transaction(b=>b-PRICE);
  });
 });
}

/* SHOW MAIL */
db.ref("msg").on("child_added",s=>{
 let d=s.val();
 if(isAdmin) playSound();
 if(d.user!==uid && !isAdmin) return;

 let r=document.createElement("div");
 r.className="row";
 r.innerHTML=`
 <button class="copy">Copy</button>
 <span>${d.email}</span>
 <input class="otp" ${isAdmin?"":"disabled"}>
 <span class="time">10:00</span>`;
 r.querySelector(".copy").onclick=()=>navigator.clipboard.writeText(d.email);

 if(isAdmin){
  r.querySelector(".otp").oninput=e=>db.ref("msg/"+s.key+"/otp").set(e.target.value);
 }
 db.ref("msg/"+s.key+"/otp").on("value",x=>{
  r.querySelector(".otp").value=x.val()||"";
 });
 list.prepend(r);
 startTimer(d.time,r.querySelector(".time"),s.key);
});

function startTimer(t,el,id){
 let x=setInterval(()=>{
  let l=EXPIRE-(Date.now()-t);
  if(l<=0){clearInterval(x);db.ref("msg/"+id).remove();}
  el.innerText=
   String(Math.floor(l/60000)).padStart(2,"0")+":"+
   String(Math.floor(l/1000)%60).padStart(2,"0");
 },1000);
}
</script>
</body>
</html>
