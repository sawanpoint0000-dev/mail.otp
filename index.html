<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TAMP.OTP FINAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#0b0e14;color:#fff;font-family:system-ui}
.card{background:#161a22;margin:12px;padding:14px;border-radius:14px}
.hide{display:none}
input,select,button{padding:10px;border-radius:8px;border:none}
button{cursor:pointer}
.row{background:#10131a;padding:10px;border-radius:12px;margin-bottom:8px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.copy{background:#22c55e;color:#000}
.otp{
 width:80px;
 text-align:center;
 color:red;
 background:#10131a;
 border:1px solid #22c55e;
 border-radius:4px;
 font-weight:700;
}
.time{font-size:12px;color:#f87171}
.row:hover{background:#151a24}
button:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>

<!-- 🔊 SOUND FILE (ADD ONLY) -->
<audio id="notifySound" src="notify.mp3" preload="auto"></audio>

<!-- AUTH -->
<div class="card" id="auth">
<h3>Login / Register</h3>
<input id="email" placeholder="Email"><br><br>
<input id="pass" placeholder="Password"><br><br>
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>

<!-- APP -->
<div id="app" class="hide">
<div class="card">
<b>TAMP.OTP</b>
<button onclick="logout()" style="float:right;background:#ef4444;color:#fff">Logout</button>
</div>

<!-- ADMIN -->
<div id="adminBox" class="card hide">
<h3>ADMIN PANEL</h3>

<!-- 🔔 NOTIFICATION BOX -->
<h4>🔔 Notifications</h4>
<div id="notifications"></div>

<h4>Domains</h4>
<input id="newDomain" placeholder="@gmail.com">
<button onclick="addDomain()">Add / Update Domain</button><br><br>

<select id="adminDomain"></select><br><br>
<input id="adminMail" placeholder="Username or full email">
<button onclick="addMail()">Add Mail</button>

<h4>Domain Stock</h4>
<div id="stocks"></div>

<h4>Users</h4>
<div id="users"></div>

<!-- 🔊 SOUND ENABLE BUTTON -->
<button onclick="document.getElementById('notifySound').play()">
Enable Notification Sound
</button>
</div>

<!-- USER -->
<div id="userBox" class="card hide">
<h3>User Panel</h3>
<div>Balance ₹<b id="bal">0</b></div><br>
<select id="userDomain">
<option value="">-- Select Domain --</option>
</select>
<button onclick="buyMail()">Buy Mail ₹1</button>
</div>

<div id="list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyDi40uxY5aC8R3xqacPL393h67TuQ4RiVo",
 databaseURL:"https://real-time-chat-box-179ea-default-rtdb.firebaseio.com"
});
const db=firebase.database();

let uid="",isAdmin=false;
const PRICE=1,EXPIRE=600000;

/* LOGIN */
function login(){
 let e=email.value,p=pass.value;
 if(e==="admin@tampotp.com" && p==="admin@123"){
  localStorage.uid="admin";location.reload();return;
 }
 db.ref("users").once("value",s=>{
  let ok=false;
  s.forEach(u=>{
   if(u.val().email===e && u.val().pass===p){
    uid=u.key;ok=true;
   }
  });
  if(!ok) return alert("Wrong login");
  localStorage.uid=uid;location.reload();
 });
}

/* REGISTER */
function register(){
 if(!email.value||!pass.value) return alert("Fill all");
 db.ref("users").once("value",s=>{
  let ex=false;
  s.forEach(u=>{if(u.val().email===email.value) ex=true});
  if(ex) return alert("Email exists");
  let id="u"+Date.now();
  db.ref("users/"+id).set({
   email:email.value,pass:pass.value,
   balance:0,buy:0,success:0,blocked:false
  });
  localStorage.uid=id;location.reload();
 });
}

function logout(){localStorage.clear();location.reload()}

/* AUTO LOGIN */
uid=localStorage.uid||"";
if(uid){
 auth.classList.add("hide");
 app.classList.remove("hide");
 if(uid==="admin"){isAdmin=true;adminBox.classList.remove("hide");}
 else{userBox.classList.remove("hide");}
}

/* LOAD DOMAINS */
db.ref("domains").on("value",s=>{
 adminDomain.innerHTML="";
 userDomain.innerHTML='<option value="">-- Select Domain --</option>';
 stocks.innerHTML="";
 s.forEach(d=>{
  adminDomain.innerHTML+=`<option value="${d.key}">${d.val().name}</option>`;
  userDomain.innerHTML+=`<option value="${d.key}">${d.val().name} (${d.val().stock||0})</option>`;
  stocks.innerHTML+=`${d.val().name} → ${d.val().stock||0}<br>`;
 });
});

/* ADD DOMAIN */
function addDomain(){
 let d=newDomain.value.trim();
 if(!d.startsWith("@")) return alert("Use @domain.com");
 let key=d.replace(".","_");
 db.ref("domains/"+key).set({name:d,stock:0,seq:0});
 newDomain.value="";
}

/* ADD MAIL */
function addMail(){
 let k=adminDomain.value,v=adminMail.value.trim();
 if(!k||!v) return alert("Fill all");

 db.ref("domains/"+k).once("value",s=>{
  let dom=s.val().name;
  let email=v.includes("@")?v:v+dom;
  let safe=email.replace(/[.#$/\[\]]/g,"_");

  db.ref("domains/"+k+"/seq").transaction(n=>{
    n=(n||0)+1;
    db.ref("mails/"+k+"/"+safe).set({email,no:n});
    return n;
  });

  db.ref("domains/"+k+"/stock").transaction(n=>(n||0)+1);
  adminMail.value="";
 });
}

/* USER BALANCE */
db.ref("users/"+uid).on("value",s=>{
 if(s.exists()){
  bal.innerText=s.val().balance||0;
  if(s.val().blocked){alert("You are blocked");logout();}
 }
});

/* BUY MAIL */
function buyMail(){
 let k=userDomain.value;
 if(!k) return alert("Select domain");

 db.ref("users/"+uid+"/balance").once("value",s=>{
  if((s.val()||0)<PRICE) return alert("No balance");

  db.ref("mails/"+k).orderByChild("no").limitToFirst(1).once("value",x=>{
    if(!x.exists()) return alert("No mail");

    let key,data;
    x.forEach(m=>{key=m.key;data=m.val();});

    db.ref("mails/"+k+"/"+key).remove();
    db.ref("domains/"+k+"/stock").transaction(n=>(n||0)-1);

    db.ref("msg").push({
      email:data.email,
      user:uid,
      time:Date.now(),
      otp:""
    });

    // 🔔 ADMIN NOTIFY
    db.ref("adminNotify").push({
      user:uid,
      email:data.email,
      time:Date.now()
    });

    db.ref("users/"+uid+"/balance").transaction(b=>b-PRICE);
   });
 });
}

/* ADMIN SOUND NOTIFICATION */
if(isAdmin){
 db.ref("adminNotify").limitToLast(20).on("child_added", s=>{
  let d=s.val();
  let div=document.createElement("div");
  div.innerHTML=`📧 ${d.email} <small>${new Date(d.time).toLocaleTimeString()}</small>`;
  notifications.prepend(div);

  let snd=document.getElementById("notifySound");
  snd.currentTime=0;
  snd.play().catch(()=>{});
 });
}
</script>
</body>
</html>
