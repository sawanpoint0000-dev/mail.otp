<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TAMP.OTP FINAL ALL FEATURES</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
 --card:rgba(255,255,255,.08);
 --primary:#7c7cff;
 --green:#22c55e;
 --red:#ef4444;
 --text:#e5e7eb;
}
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 font-family:system-ui;
 background:radial-gradient(circle at top,#1b1f3b,#020617);
 color:var(--text);
}
.card{
 background:var(--card);
 backdrop-filter:blur(14px);
 border-radius:18px;
 margin:12px;
 padding:16px;
 box-shadow:0 10px 30px rgba(0,0,0,.4);
}
input,select,button{
 width:100%;
 padding:12px;
 border-radius:12px;
 border:none;
 outline:none;
 background:#020617;
 color:#fff;
}
button{
 background:linear-gradient(135deg,var(--primary),#4f46e5);
 font-weight:600;
 cursor:pointer;
}
.logout{
 width:auto;
 background:linear-gradient(135deg,#ef4444,#b91c1c);
}
.row{
 background:rgba(0,0,0,.45);
 border-radius:14px;
 padding:12px;
 margin-bottom:8px;
 display:flex;
 gap:8px;
 align-items:center;
 overflow:hidden;
}
.row span{
 flex:1;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
 font-size:13px;
}
.copy{
 background:linear-gradient(135deg,#22c55e,#16a34a);
 color:#000;
 width:auto;
}
.otp{
 width:70px;
 text-align:center;
 font-weight:700;
 color:#22c55e;
 background:#020617;
 border:1px solid #22c55e;
 border-radius:10px;
}
.time{
 font-size:12px;
 color:#fca5a5;
 min-width:48px;
 text-align:right;
}
.hide{display:none}
.adminUser{
 background:rgba(0,0,0,.35);
 padding:12px;
 border-radius:14px;
 margin-bottom:10px;
 font-size:13px;
}
.adminUser button{
 width:auto;
 margin-right:6px;
 padding:8px 12px;
}
.avatar{
 width:46px;
 height:46px;
 border-radius:50%;
 background:linear-gradient(135deg,#7c7cff,#22c55e);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:22px;
 font-weight:800;
 color:#000;
 text-transform:uppercase;
}
.badge{
 background:#16a34a;
 padding:3px 6px;
 border-radius:6px;
 font-size:10px;
 animation:blink 1s infinite;
}
@keyframes blink{
 0%{opacity:1}
 50%{opacity:.3}
 100%{opacity:1}
}
</style>
</head>
<body>

<!-- SOUNDS -->
<audio id="buySound" preload="auto">
 <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>
<audio id="otpSound" preload="auto">
 <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>

<!-- LOGIN -->
<div class="card" id="auth">
<h3>🔐 Login / Register</h3>
<input id="email" placeholder="Email"><br><br>
<input id="pass" placeholder="Password"><br><br>
<button onclick="login()">Login</button><br><br>
<button onclick="register()" style="background:#22c55e">Register</button>
</div>

<div id="app" class="hide">
<div class="card" style="display:flex;justify-content:space-between;align-items:center">
<b>🚀 TAMP.OTP</b>
<button class="logout" onclick="logout()">Logout</button>
</div>

<!-- ADMIN -->
<div id="adminBox" class="card hide">
<h3>👑 ADMIN PANEL</h3>

<input id="newDomain" placeholder="@gmail.com">
<button onclick="addDomain()">Add Domain</button><br><br>

<select id="adminDomain"></select><br><br>
<input id="adminMail" placeholder="username">
<button onclick="addMail()">Add Mail</button>

<h4>📦 Domain Stock</h4>
<div id="stocks"></div>

<h4>👥 Users</h4>
<div id="users"></div>
</div>

<!-- USER -->
<div id="userBox" class="card hide">
<div style="display:flex;gap:12px;align-items:center">
 <div class="avatar" id="avatar"></div>
 <div>
  <div style="font-weight:700">My Profile</div>
  <div id="userEmail" style="font-size:12px;color:#cbd5f5"></div>
 </div>
</div>

<br>
Balance ₹ <b id="bal">0</b><br><br>

<select id="userDomain">
<option value="">-- Select Domain --</option>
</select><br><br>

<button onclick="buyMail()">Buy Mail ₹1</button>
</div>

<div id="list" class="card"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyDi40uxY5aC8R3xqacPL393h67TuQ4RiVo",
 databaseURL:"https://real-time-chat-box-179ea-default-rtdb.firebaseio.com"
});
const db=firebase.database();
const PRICE=1, EXPIRE=600000;
let uid="", isAdmin=false;

/* 🔔 SOUND */
function playBeep(){document.getElementById("buySound").play().catch(()=>{});}
function playOTP(){document.getElementById("otpSound").play().catch(()=>{});}

/* LOGIN */
function login(){
 if(email.value==="admin@tampotp.com" && pass.value==="admin@123"){
  localStorage.uid="admin";location.reload();return;
 }
 db.ref("users").once("value",s=>{
  s.forEach(u=>{
   if(u.val().email===email.value && u.val().pass===pass.value){
    localStorage.uid=u.key;location.reload();
   }
  });
 });
}

/* REGISTER */
function register(){
 let id="u"+Date.now();
 db.ref("users/"+id).set({
  email:email.value,
  pass:pass.value,
  balance:0,
  blocked:false,
  canBuy:true
 });
 localStorage.uid=id;location.reload();
}

function logout(){localStorage.clear();location.reload()}

uid=localStorage.uid||"";
if(uid){
 auth.classList.add("hide");
 app.classList.remove("hide");
 if(uid==="admin"){isAdmin=true;adminBox.classList.remove("hide")}
 else{userBox.classList.remove("hide")}
}

db.ref("users/"+uid).once("value",s=>{
 if(!s.exists()) return;
 bal.innerText=s.val().balance||0;
 if(!isAdmin){
  userEmail.innerText=s.val().email;
  avatar.innerText=s.val().email.charAt(0);
 }
 if(s.val().blocked){alert("Blocked");logout()}
});

/* DOMAINS */
db.ref("domains").on("value",s=>{
 adminDomain.innerHTML="";
 userDomain.innerHTML='<option value="">-- Select Domain --</option>';
 stocks.innerHTML="";
 s.forEach(d=>{
  adminDomain.innerHTML+=`<option value="${d.key}">${d.val().name}</option>`;
  userDomain.innerHTML+=`<option value="${d.key}">${d.val().name} (${d.val().stock||0})</option>`;
  stocks.innerHTML+=`${d.val().name} → ${d.val().stock||0}<br>`;
 });
});

function addDomain(){
 let k=newDomain.value.replace(".","_");
 db.ref("domains/"+k).set({name:newDomain.value,stock:0,seq:0});
 newDomain.value="";
}

function addMail(){
 let k=adminDomain.value,v=adminMail.value;
 db.ref("domains/"+k).once("value",s=>{
  let email=v+s.val().name;
  let safe=email.replace(/[.#$/\[\]]/g,"_");
  db.ref("domains/"+k+"/seq").transaction(n=>{
   n=(n||0)+1;
   db.ref("mails/"+k+"/"+safe).set({email,no:n});
   return n;
  });
  db.ref("domains/"+k+"/stock").transaction(n=>(n||0)+1);
 });
 adminMail.value="";
}

/* ADMIN USERS */
if(isAdmin){
 db.ref("users").on("value",s=>{
  users.innerHTML="";
  s.forEach(u=>{
   if(u.key==="admin")return;
   let d=u.val();
   users.innerHTML+=`
   <div class="adminUser">
    <b>${d.email}</b><br>
    ₹${d.balance||0}<br><br>
    <button onclick="db.ref('users/${u.key}/balance').transaction(b=>(b||0)+1)" style="background:#22c55e">Add ₹</button>
    <button onclick="db.ref('users/${u.key}/blocked').set(${!d.blocked})" style="background:${d.blocked?'#22c55e':'#ef4444'}">${d.blocked?'Unblock':'Block'}</button>
    <button onclick="db.ref('users/${u.key}/canBuy').set(${!d.canBuy})" style="background:${d.canBuy?'#ef4444':'#22c55e'}">${d.canBuy?'Stop Buy':'Allow Buy'}</button>
   </div>`;
  });
 });
}

/* BUY MAIL */
function buyMail(){
 let k=userDomain.value;
 db.ref("users/"+uid).once("value",u=>{
  if(!u.val().canBuy) return alert("Admin ne buy band kar diya");
  if((u.val().balance||0)<PRICE) return alert("No balance");
  db.ref("mails/"+k).orderByChild("no").limitToFirst(1).once("value",x=>{
   let key,data;
   x.forEach(m=>{key=m.key;data=m.val()});
   db.ref("mails/"+k+"/"+key).remove();
   db.ref("domains/"+k+"/stock").transaction(n=>(n||0)-1);
   db.ref("msg").push({email:data.email,user:uid,time:Date.now(),otp:""});
   db.ref("users/"+uid+"/balance").transaction(b=>b-1);
   db.ref("buy").push({user:uid,time:Date.now()}); // 🔔 ADMIN BEEP
  });
 });
}

/* SHOW MAIL + OTP + ADMIN BEEP */
db.ref("msg").on("child_added",s=>{
 let d=s.val();
 if(d.user!==uid && !isAdmin) return;

 // 🔔 Admin beep for new mail
 if(isAdmin) playBeep();

 let r=document.createElement("div");
 r.className="row";
 r.innerHTML=`
 <button class="copy">Copy</button>
 <span>${d.email}</span>
 <input class="otp" ${isAdmin?"":"disabled"}>
 <span class="time">10:00</span>`;
 r.querySelector(".copy").onclick=()=>navigator.clipboard.writeText(d.email);

 if(isAdmin) r.querySelector(".otp").oninput=e=>db.ref("msg/"+s.key+"/otp").set(e.target.value);
 db.ref("msg/"+s.key+"/otp").on("value",x=>r.querySelector(".otp").value=x.val()||"");

 list.prepend(r);

 // ⏱ Auto expire 10 minutes
 setInterval(()=>{
   let l=EXPIRE-(Date.now()-d.time);
   if(l<=0) r.remove();
   else r.querySelector(".time").innerText=String(Math.floor(l/60000)).padStart(2,"0")+":"+String(Math.floor(l/1000)%60).toString().padStart(2,"0");
 },1000);
});
</script>
</body>
</html>
